<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sucursales - Como en Casa</title>
  <meta name="description" content="Encontrá nuestras sucursales cercanas.">
  <link rel="stylesheet" href="../css/estilos.css?v=3">
</head>
<script>
(()=> {
  const btn  = document.querySelector('.nav-toggle');
  if (!btn) return;
  const targetId = btn.getAttribute('aria-controls');
  const menu = document.getElementById(targetId);
  if (!menu) return;

  btn.addEventListener('click', ()=>{
    const open = menu.classList.toggle('active');
    btn.setAttribute('aria-expanded', open);
  });
})();
</script>

<body>
  <header>
    <nav class="navbar">
      <div class="brand">Como en Casa</div>

      <!-- Botón hamburguesa (mobile) -->
      <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="primary-menu">
        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
      </button>

      <!-- Menú principal -->
      <ul id="primary-menu" class="nav-menu">
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="./nosotros.html">Nosotros</a></li>
        <li><a href="./sucursales.html">Sucursales</a></li>
        <li><a href="./galeria.html">Galería</a></li>
        <li><a href="./contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="section section--xl">
      <h2>Nuestras Sucursales</h2>
      <div class="branches">
        <article class="branch">
          <h3>La Plata</h3>
          <p>Calle 12 #456</p>
        </article>
        <article class="branch">
          <h3>Berisso</h3>
          <p>Av. Montevideo 2020</p>
        </article>
        <article class="branch">
          <h3>Ensenada</h3>
          <p>Calle Ortiz de Rosas 88</p>
        </article>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-inner">
      <small>&copy; 2025 Como en Casa</small>
      <div class="social">
        <a href="https://facebook.com" target="_blank" aria-label="Facebook"><img src="../icons/facebook.svg" alt="Facebook"></a>
        <a href="https://twitter.com" target="_blank" aria-label="Twitter"><img src="../icons/twitter.svg" alt="Twitter"></a>
        <a href="https://instagram.com" target="_blank" aria-label="Instagram"><img src="../icons/instagram.png" alt="Instagram"></a>
      </div>
    </div>
  </footer>

  <!-- Toggle del menú (JS liviano) -->
  <script>
    (function(){
      const toggle = document.querySelector('.nav-toggle');
      const menu   = document.querySelector('#primary-menu');
      if(!toggle || !menu) return;

      toggle.addEventListener('click', () => {
        const open = menu.classList.toggle('is-open');
        toggle.classList.toggle('is-open', open);
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      });

      menu.addEventListener('click', (e) => {
        if(e.target.tagName === 'A'){
          menu.classList.remove('is-open');
          toggle.classList.remove('is-open');
          toggle.setAttribute('aria-expanded','false');
        }
      });
    })();
  </script>
</body>
</html>
